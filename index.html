<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>YG Soluciones · Acceso al Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <div class="logo-symbol">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h1>YG Soluciones</h1>
                <p>Dashboard Ejecutivo · Acceso seguro</p>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="input-group">
                    <label class="input-label" for="email">
                        <i class="fas fa-envelope"></i>
                        <span>Correo electrónico</span>
                    </label>
                    <input type="email" id="email" name="email" class="input-field" placeholder="usuario@empresa.com" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label class="input-label" for="password">
                        <i class="fas fa-lock"></i>
                        <span>Contraseña</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberCheck"> <span>Recordarme</span>
                    </label>
                    <a href="Reset/reset.html" class="forgot-link" id="forgotLink">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    <span>Iniciar sesión</span>
                </button>

                <div id="messageContainer" class="message-area"></div>
            </form>

            <div class="signup-prompt">
                ¿Nuevo aquí? <a href="#" id="signupMock">Solicitar acceso</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
