<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>YG Soluciones · Nueva contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="new-password.css">
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="brand-header">
                <div class="logo-symbol">
                    <i class="fas fa-lock-open"></i>
                </div>
                <h1>Nueva contraseña</h1>
                <p>Ingresa el código que recibiste y tu nueva contraseña</p>
            </div>

            <form id="resetPasswordForm" class="reset-form" novalidate>
                <div class="input-group">
                    <label class="input-label" for="email">
                        <i class="fas fa-envelope"></i>
                        <span>Correo electrónico</span>
                    </label>
                    <input type="email" id="email" name="email" class="input-field" placeholder="usuario@empresa.com" autocomplete="email" required readonly style="background:#1e2a3e;opacity:0.8;">
                </div>

                <div class="input-group">
                    <label class="input-label" for="resetCode">
                        <i class="fas fa-qrcode"></i>
                        <span>Código de verificación</span>
                    </label>
                    <input type="text" id="resetCode" name="resetCode" class="input-field" placeholder="Ingresa el código de 6 dígitos" required maxlength="6">
                </div>

                <div class="input-group">
                    <label class="input-label" for="newPassword">
                        <i class="fas fa-lock"></i>
                        <span>Nueva contraseña</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" class="input-field" placeholder="Mínimo 6 caracteres" required>
                        <button type="button" class="toggle-password" id="toggleNewPassword" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="confirmPassword">
                        <i class="fas fa-check-circle"></i>
                        <span>Confirmar contraseña</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="input-field" placeholder="Repite tu nueva contraseña" required>
                        <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="reset-btn" id="resetBtn">
                    <i class="fas fa-save"></i>
                    <span>Restablecer contraseña</span>
                </button>

                <div id="messageContainer" class="message-area"></div>
            </form>

            <div class="back-link">
                <a href="../index.html">
                    <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
                </a>
            </div>
        </div>
    </div>

    <script src="new-password.js"></script>
</body>
</html>
