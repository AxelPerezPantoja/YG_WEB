<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>YG Soluciones · Recuperar contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="brand-header">
                <div class="logo-symbol">
                    <i class="fas fa-key"></i>
                </div>
                <h1>Recuperar contraseña</h1>
                <p>Te enviaremos un código para restablecer tu acceso</p>
            </div>

            <form id="resetForm" class="reset-form" novalidate>
                <div class="input-group">
                    <label class="input-label" for="email">
                        <i class="fas fa-envelope"></i>
                        <span>Correo electrónico</span>
                    </label>
                    <input type="email" id="email" name="email" class="input-field" placeholder="usuario@empresa.com" autocomplete="email" required>
                </div>

                <button type="submit" class="reset-btn" id="resetBtn">
                    <i class="fas fa-paper-plane"></i>
                    <span>Enviar código</span>
                </button>

                <div id="messageContainer" class="message-area"></div>
            </form>

            <div class="back-link">
                <a href="../index.html">
                    <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
                </a>
            </div>
        </div>
    </div>

    <script src="reset.js"></script>
</body>
</html>
